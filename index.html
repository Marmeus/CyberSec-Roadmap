<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberSecurity Certification Roadmap</title>
  <meta name="description" content="A cybersecurity certification roadmap across eight domains.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,680&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=22">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#2e5688">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="msapplication-config" content="/favicons/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="brand">
      <p class="eyebrow">Cybersecurity</p>
      <h1><a href="#/">Certification Roadmap</a></h1>
    </div>
    <div class="stripe" aria-hidden="true">
      <span style="background:#70AD47"></span>
      <span style="background:#008080"></span>
      <span style="background:#fa8e36"></span>
      <span style="background:#e4ac03"></span>
      <span style="background:#2a2a2a"></span>
      <span style="background:#683e9b"></span>
      <span style="background:#6bb3f6"></span>
      <span style="background:#2e5688"></span>
      <span style="background:#c0514d"></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-top">
      <label class="field">
        <span>Search</span>
        <input id="search" type="search" placeholder="Acronym, name, or exam detail" autocomplete="off">
      </label>
      <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-label="Toggle filters">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span id="filter-badge" class="filter-badge" hidden></span>
      </button>
      <button id="domain-toggle" class="view-toggle" type="button" aria-pressed="false" title="Group by domain">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="6" height="16" rx="1"/><rect x="9" y="4" width="6" height="16" rx="1"/><rect x="17" y="4" width="6" height="16" rx="1"/></svg>
      </button>
    </div>
    <label class="field filter-field" id="area-field">
      <span>Area</span>
      <select id="area"></select>
    </label>
    <label class="field filter-field" id="domain-field" hidden>
      <span>Domain</span>
      <select id="domain"></select>
    </label>
    <label class="field filter-field" id="specialty-field" hidden>
      <span>Specialty</span>
      <select id="specialty"></select>
    </label>
    <label class="field filter-field">
      <span>Level</span>
      <select id="level">
        <option value="all">All levels</option>
      </select>
    </label>
    <button id="filter-reset" class="filter-field filter-reset" type="button" hidden>Reset filters</button>
    <p id="count" class="count" aria-live="polite"></p>
    <div id="hscroll" class="hscroll" tabindex="0" aria-label="Scroll the roadmap sideways" hidden>
      <div id="hscroll-inner"></div>
    </div>
  </div>
  <div id="tabs" class="tabs" role="tablist" aria-label="Areas" hidden></div>

  <main id="main">
    <p class="loading">Loading certifications…</p>
  </main>

  <footer class="site-footer">
    <p>
      This page is licensed <a href="LICENSE">CC BY-SA 4.0</a>.
    </p>
  </footer>

  <div id="cert-tooltip" class="cert-tooltip" hidden>
    <strong class="tip-name"></strong>
    <span class="tip-issuer"></span>
    <span class="tip-price"></span>
  </div>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail-bar">
      <button id="detail-close" type="button">Close</button>
    </div>
    <p id="detail-kicker" class="detail-kicker"></p>
    <h2 id="detail-title"></h2>
    <p id="detail-name" class="detail-name"></p>
    <dl id="detail-meta" class="detail-meta"></dl>
    <ul id="detail-lines" class="detail-lines"></ul>
    <p id="detail-link" class="detail-link"></p>
  </aside>

  <noscript>
    <p class="noscript">This roadmap needs JavaScript to load the certification catalog.</p>
  </noscript>
  <script src="js/app.js?v=19"></script>
</body>
</html>
