    <label class="field filter-field" id="area-field">
      <span>Area</span>
      <select id="area"></select>
    </label>
    <label class="field filter-field" id="domain-field" hidden>
      <span>Domain</span>
      <select id="domain"></select>
    </label>
    <label class="field filter-field" id="specialty-field" hidden>
      <span>Specialty</span>
      <select id="specialty"></select>
    </label>
    <label class="field filter-field">
      <span>Level</span>
      <select id="level">
        <option value="all">All levels</option>
      </select>
    </label>
    <button id="filter-reset" class="filter-field filter-reset" type="button" hidden>Reset filters</button>
    <p id="count" class="count" aria-live="polite"></p>
    <div id="hscroll" class="hscroll" tabindex="0" aria-label="Scroll the Map sideways" hidden>
      <div id="hscroll-inner"></div>

  <div id="tabs" class="tabs" role="tablist" aria-label="Areas" hidden></div>
